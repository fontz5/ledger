<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="shell">
  <header class="header">
    <span class="logo">Led<b>ger</b></span>
  </header>

  <nav class="nav" aria-label="Views">
    <button class="tab" data-view="tasks" aria-current="page">Tasks</button>
    <button class="tab" data-view="deadlines">Deadlines</button>
    <button class="tab" data-view="calendar">Calendar</button>
  </nav>

  <main class="pane" id="pane"></main>

  <button class="add-btn" id="addBtn" aria-label="Add task">+</button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
